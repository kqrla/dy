<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain with scattered dots (representing scattered thinking) -->
  <g id="brain">
    <!-- Main brain outline -->
    <path d="M 100 40 Q 70 50 70 80 Q 70 110 85 130 L 100 145 L 115 130 Q 130 110 130 80 Q 130 50 100 40"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Brain folds/wrinkles -->
    <path d="M 85 60 Q 90 70 85 80" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 115 60 Q 110 70 115 80" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M 90 85 Q 100 95 110 85" fill="none" stroke="currentColor" stroke-width="1.5"/>

    <!-- Scattered thought dots (chaotic) -->
    <circle cx="50" cy="55" r="3" fill="currentColor" opacity="0.6"/>
    <circle cx="150" cy="65" r="2.5" fill="currentColor" opacity="0.6"/>
    <circle cx="55" cy="100" r="2" fill="currentColor" opacity="0.6"/>
    <circle cx="145" cy="110" r="3" fill="currentColor" opacity="0.6"/>
    <circle cx="45" cy="130" r="2.5" fill="currentColor" opacity="0.6"/>
    <circle cx="155" cy="95" r="2" fill="currentColor" opacity="0.6"/>

    <!-- Connection lines showing chaotic connections -->
    <line x1="50" y1="55" x2="70" y2="65" stroke="currentColor" stroke-width="1" opacity="0.4"/>
    <line x1="150" y1="65" x2="130" y2="85" stroke="currentColor" stroke-width="1" opacity="0.4"/>
    <line x1="55" y1="100" x2="100" y2="110" stroke="currentColor" stroke-width="1" opacity="0.4"/>
    <line x1="145" y1="110" x2="115" y2="100" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Circuitry-inspired border to tie in electronics origin -->
  <rect x="20" y="20" width="160" height="160" rx="20" fill="none"
        stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
</svg>
